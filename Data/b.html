<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Achievements</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000a3d;
      color: #111;
    }

    .achievements {
      padding: 60px 8%;
      text-align: center;
      position: relative;
    }

    .achievements h3 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .facts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
      position: relative;
      z-index: 2;
    }

    .fact {
      background: #ff5722;
      color: #fff;
      padding: 20px 25px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 240px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
      position: relative;
      transition: all 0.3s ease; /* smooth transition */
    }

    .fact:hover {
      transform: translateY(-8px); /* lift up */
      box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
    }

    /* Icon style inside rectangle */
    .fact i {
      font-size: 40px;
      color: #0a2342;
      background: #fff;
      border-radius: 50%;
      padding: 12px;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: absolute;
      left: -30px;
    }

    .fact-text {
      text-align: center; /* center align text */
      width: 100%;
    }

    .fact-text strong {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }

    .fact-text small {
      font-size: 14px;
      opacity: 0.9;
    }

    /* Crane image right side */
    .crane-img {
      position: absolute;
      right: 5%;
      bottom: 0;
      width: 260px;
      z-index: 1;
    }

    @media(max-width: 991px) {
      .facts {
        flex-direction: column;
        align-items: center;
      }
      .crane-img {
        position: relative;
        margin: 30px auto 0;
        display: block;
      }
    }
  </style>
</head>
<body>

  <section class="achievements">
    <h3>Industry Achievements</h3>
    <div class="facts">
      <div class="fact">
        <i class="fa-solid fa-industry"></i>
        <div class="fact-text">
          <strong>176+</strong>
          <small>Chain of Factories</small>
        </div>
      </div>

      <div class="fact">
        <i class="fa-solid fa-clipboard-check"></i>
        <div class="fact-text">
          <strong>800+</strong>
          <small>Projects Completed</small>
        </div>
      </div>

      <div class="fact">
        <i class="fa-solid fa-user-gear"></i>
        <div class="fact-text">
          <strong>230+</strong>
          <small>Expert Engineers</small>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
