<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConvoFlow Clone</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: white;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 20px 30px;
      background: transparent;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
    }

    .navbar .logo {
      font-size: 24px;
      font-weight: 700;
    }

    .logo span {
      color: #ff408c;
    }

    .navbar ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    .navbar ul li a {
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      transition: 0.3s;
    }

    .navbar ul li a:hover {
      color: #ff408c;
    }

    .get-started {
      background: #ff408c;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(255, 64, 140, 0.4);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 150px 20px 100px;
      position: relative;
      background: radial-gradient(circle at center, rgba(255, 64, 140, 0.25) 0%, rgba(13, 13, 15, 1) 40%);
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.3;
    }

    /* Gradient text for SuperCharge */
    .hero h1 span {
      background: linear-gradient(90deg, #ff408c, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
    }

    .hero p {
      margin-top: 15px;
      color: #aaa;
      font-size: 16px;
    }

    .btn-demo {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #ff408c;
      color: white;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(255, 64, 140, 0.4);
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 70px;
      flex-wrap: wrap;
    }

    .stat-box {
      background: #1c1c1f;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 200px;
    }

    .stat-box i {
      font-size: 30px;
      background: #ff408c;
      padding: 12px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .stat-box h3 {
      margin: 10px 0;
      font-size: 24px;
      font-weight: 700;
    }
  </style>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">Convo<span>Flow</span></div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <a href="#" class="get-started"><i class="fa-solid fa-calendar"></i> Get Started</a>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <h1><span>SuperCharge</span> Your Sales <br> With AI-Powered Automation</h1>
    <p>Boost Revenue by 3x with an AI Army that Generates, Qualifies, & Closes Deals 24/7</p>
    <a href="#" class="btn-demo"><i class="fa-solid fa-calendar"></i> Schedule a Demo</a>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-box">
        <i class="fa-solid fa-robot"></i>
        <h3>90%</h3>
      </div>
      <div class="stat-box">
        <i class="fa-solid fa-bolt"></i>
        <h3>24/7</h3>
      </div>
      <div class="stat-box">
        <i class="fa-solid fa-dollar-sign"></i>
        <h3>100%</h3>
      </div>
    </div>
  </section>

</body>
</html>
